<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sweet Message</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;height:100vh;
  background:linear-gradient(to top,#fff0f6,#ffe6f0);
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
  font-family:Segoe UI,sans-serif;
  perspective:1000px;
  text-align:center;
}
.container{
  position:relative;
  z-index:2;
}
h1{
  font-size:2rem;
  color:#ff4d88;
  margin-bottom:15px;
}
p{
  font-size:1rem;
  color:#555;
  margin-bottom:25px;
}
img{
  width:200px;
  height:200px;
  border-radius:25px;
  object-fit:cover;
  border:4px solid #ff4d88;
  box-shadow:0 0 30px rgba(255,77,136,.5);
  margin-bottom:20px;
}
button{
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ff4d88;
  color:white;
  font-size:1rem;
  margin-top:10px;
  cursor:pointer;
}

/* 3D floating hearts */
.heart{
  position:absolute;
  font-size:24px;
  transform-style:preserve-3d;
  animation:float3d linear infinite;
}
@keyframes float3d{
  0%{transform:translate3d(0,0,0) rotateY(0deg);}
  50%{transform:translate3d(0,-400px,200px) rotateY(180deg);}
  100%{transform:translate3d(0,-800px,0) rotateY(360deg);}
}
</style>
</head>

<body>
<div class="container">
  <h1>Sweet Message for My Cutiee 💖</h1>
  <img src="IMG_20260202_230603_697.jpg.jpeg">
  <p>Meri cutiee Malikn Jee , I Love You✨</p>
  <button onclick="location.href='index.html'">Back Home 🔁</button>
</div>

<script>
for(let i=0;i<30;i++){
  createHeart();
}

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*window.innerWidth+"px";
  h.style.top=window.innerHeight+"px";
  const size=18+Math.random()*15;
  h.style.fontSize=size+"px";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  h.style.transform=`rotateY(${Math.random()*360}deg)`;
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}
</script>
</body>
</html>
