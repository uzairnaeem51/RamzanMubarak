<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine’s Day Fatima</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background:linear-gradient(to top,#ffd6e8,#fff);
  font-family:Segoe UI,sans-serif;text-align:center;
}
.card{
  background:white;padding:35px;border-radius:25px;
  box-shadow:0 20px 40px rgba(255,105,135,.3);
  width:330px;
}
h1{color:#ff4d88;}
h2{color:#ff7aa2;}
button{
  margin-top:20px;
  padding:14px 35px;border:none;border-radius:30px;
  background:#ff4d88;color:white;font-size:1rem;
  cursor:pointer;
}
button:hover{transform:scale(1.05);}
</style>
</head>

<body>
<div class="card">
  <h1>Happy Valentine’s Day</h1>
  <h2>Fatima 💖</h2>
  <p>Start your Valentine surprise ✨</p>

  <button onclick="location.href='surprise.html'">
    Start Surprise 💕
  </button>
</div>
</body>
</html>
