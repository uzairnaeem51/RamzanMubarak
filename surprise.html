<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Valentine?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;height:100vh;
  background:linear-gradient(to top,#ffe0ed,#fff);
  display:flex;justify-content:center;align-items:center;
  font-family:Segoe UI,sans-serif;text-align:center;
  overflow:hidden;
}
.card{
  background:white;padding:30px;border-radius:25px;
  box-shadow:0 20px 40px rgba(255,105,135,.3);
  width:320px;
}
img{
  width:200px;height:200px;
  border-radius:25px;
  object-fit:cover;
  margin:20px 0;
  border:4px solid #ff4d88;
  box-shadow:0 0 30px rgba(255,77,136,.5);
}
button{
  margin:10px;padding:12px 30px;
  border:none;border-radius:30px;
  background:#ff4d88;color:white;
  font-size:1rem;
  cursor:pointer;
  position:relative;
}
button:hover{transform:scale(1.05);}
.heart{
  position:absolute;
  font-size:24px;
  animation:float linear forwards;
}
@keyframes float{
  to{transform:translateY(-800px) rotate(360deg);opacity:0;}
}
</style>
</head>

<body>
<div class="card">
  <h1>Will you be my Valentine? 💖</h1>
  <img src="IMG_20260202_230603_697.jpg.jpeg">
  <div>
    <button onclick="yesClick()">Yes 💕</button>
    <button id="noBtn">No 😅</button>
  </div>
</div>

<script>
function yesClick(){
  location.href='sweet.html';
}

// Funny NO button
const noBtn = document.getElementById("noBtn");

// When mouse enters NO button, it jumps randomly
noBtn.addEventListener("mouseenter", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// When clicked, create crazy flying emojis
noBtn.addEventListener("click", () => {
  for(let i=0;i<15;i++){
    let h=document.createElement("div");
    h.className="heart";
    const emojis = ["😂","😜","🤪","🙃","🤣"];
    h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*window.innerWidth+"px";
    h.style.top=window.innerHeight+"px";
    const size=20+Math.random()*15;
    h.style.fontSize=size+"px";
    h.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
});
</script>
</body>
</html>
